name: Verify source and portable release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Installer plans / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Package-manager calls and native office launch are mocked; no system installs.
      - run: python -m unittest discover -s tests -p test_setup.py -v
      - name: Parse Windows bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/bootstrap-windows.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Write-Error; exit 1 }
      - name: Windows entrypoint without installation
        if: runner.os == 'Windows'
        shell: cmd
        run: setup.cmd --web-only --check

  web:
    name: Static site / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npm run check:release
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: celluloid-toolkit
          path: dist/downloads/toolkit.zip
          if-no-files-found: error

  python:
    name: Companion, CLI and real FFmpeg conversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python tests/test_ods.py
      - run: python -m unittest discover -s native -v
      - run: python -m pytest backend/tests -q
      # Real desktop UNO tests are opt-in: see native/README.md. No fake Calc pass.
